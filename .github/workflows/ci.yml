name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  calidad:
    name: Formato, lints y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Dependencias de sistema para la GUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Comprobar formato
        run: cargo fmt --all -- --check

      - name: Clippy (sin advertencias)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Pruebas
        run: cargo test --workspace --all-targets --locked

      - name: Compilar en modo release
        run: cargo build --workspace --release --locked

  portabilidad:
    name: Compilación en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Dependencias de sistema para la GUI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Compilar el workspace
        run: cargo build --workspace --locked

  seguridad:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Auditar con RustSec
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
