[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/docs",
    "crates/llm",
    "crates/rag",
    "crates/storage",
    "crates/ui",
    "crates/app",
]

[workspace.package]
version = "2.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["perseoq"]
repository = "https://github.com/perseoq/raggy"
homepage = "https://github.com/perseoq/raggy"

[workspace.dependencies]
# --- crates internos ---
raggy-core = { path = "crates/core" }
raggy-docs = { path = "crates/docs" }
raggy-llm = { path = "crates/llm" }
raggy-rag = { path = "crates/rag" }
raggy-storage = { path = "crates/storage" }
raggy-ui = { path = "crates/ui" }

# --- runtime / errores ---
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
anyhow = "1.0"
thiserror = "2.0"

# --- serialización ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
# --- logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# --- seguridad ---
zeroize = "1.9"

# --- persistencia ---
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
cap-std = "3.4.6"
tempfile = "3.27.0"

# --- rutas del sistema ---
directories = "6.0"

# --- indexación de carpetas ---
pulldown-cmark = "0.13"
notify = "8.2"
walkdir = "2.5"
blake3 = "1.8"
rfd = "0.17"

# --- extracción de documentos ---
calamine = "0.36"
csv = "1.3"
lopdf = "0.45"
quick-xml = "0.41"

# --- proveedores de LLM ---
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }

# --- interfaz gráfica ---
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "x11",
    "default_fonts",
] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["svg"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
